services:
  - type: web
    name: china-thread-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: china-thread-dashboard-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: china-thread-dashboard-db
    plan: free
    databaseName: thread_dashboard
    user: thread_dashboard_user
    postgresMajorVersion: "18"
