services:
  - type: web
    name: diamond-kpi
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: diamond-kpi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: COMPANY_NAME
        value: 晶鑽生醫
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: FORCE_PRIVILEGED_MFA
        value: "false"
      - key: LOGIN_MAX_FAILURES
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: SESSION_MAX_AGE
        value: "28800"

databases:
  - name: diamond-kpi-db
    region: singapore
    plan: free
    databaseName: diamond_kpi
    user: diamond_kpi
    postgresMajorVersion: "17"
    ipAllowList: []
