services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diamond_kpi
      POSTGRES_USER: diamond
      POSTGRES_PASSWORD: diamond_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamond -d diamond_kpi"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://diamond:diamond_change_me@db:5432/diamond_kpi
      SECRET_KEY: replace-with-a-long-random-secret
      COMPANY_NAME: 晶鑽生醫
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
volumes:
  postgres_data:
