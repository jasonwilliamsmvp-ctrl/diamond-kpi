<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ company }} 登入</title><link rel="stylesheet" href="/static/style.css"></head><body class="loginbody"><div class="loginbox"><div class="loginbrand"><div class="gem big">◇</div><h1>{{ company }}</h1><p>Enterprise KPI & Sales CRM Platform</p></div>{% if request.query_params.get('locked') %}<div class="alert">登入失敗次數過多，帳號已暫時鎖定。</div>{% elif request.query_params.get('error') %}<div class="alert">帳號或密碼錯誤</div>{% endif %}<form method="post" action="/login"><label>帳號<input name="username" autocomplete="username" required autofocus></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">安全登入</button></form><div class="demo">正式環境不顯示示範帳密。主管與管理員需完成 MFA。</div></div></body></html>
