{% extends 'base.html' %}{% block title %}編輯我的客戶{% endblock %}{% block subtitle %}只能修改自己負責的客戶；不允許變更歸屬{% endblock %}{% block content %}<section class="panel formpanel"><h2>{{clinic.name}}</h2><form method="post" action="/sales-portal/clinics/{{clinic.id}}/edit" class="formgrid wide-form"><label>客戶代碼<input name="code" value="{{clinic.code}}" required></label><label>診所名稱<input name="name" value="{{clinic.name}}" required></label><label>城市<input name="city" value="{{clinic.city}}" required></label><label>聯絡人<input name="contact_person" value="{{clinic.contact_person}}"></label><label>電話<input name="phone" value="{{clinic.phone}}"></label><label>地址<input name="address" value="{{clinic.address}}"></label><label>客戶分類<select name="customer_class">{% for k,v in class_labels.items() %}<option value="{{k}}" {% if clinic.customer_class==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><button type="submit">儲存客戶</button></form><p><a href="/sales-portal?tab=customers">← 返回我的客戶管理</a></p></section>{% endblock %}
