{% extends 'base.html' %}
{% block title %}編輯業績{% endblock %}
{% block subtitle %}修改業務、產品、診所、數量與認列金額{% endblock %}
{% block content %}
<section class="panel formpanel">
  <div class="panelhead"><h2>業績 #{{ sale.id }}</h2><a class="btnlink" href="/sales">返回業績管理</a></div>
  <form method="post" class="formgrid">
    <label>日期<input name="sale_date" type="date" value="{{ sale.sale_date }}" required></label>
    <label>業務姓名
      <select name="employee_id" required>
        {% for e in employees %}
        <option value="{{ e.id }}" {% if e.id == sale.employee_id %}selected{% endif %}>{{ e.name }}（{{ e.title }}・{{ e.region }}）</option>
        {% endfor %}
      </select>
    </label>
    <label>產品
      <select name="product_id" required>
        {% for p in products %}<option value="{{ p.id }}" {% if p.id == sale.product_id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
      </select>
    </label>
    <label>診所
      <select name="clinic_id" required>
        {% for c in clinics %}<option value="{{ c.id }}" {% if c.id == sale.clinic_id %}selected{% endif %}>{{ c.name }}（{{ c.region }}）</option>{% endfor %}
      </select>
    </label>
    <label>數量<input name="quantity" type="number" step="0.01" min="0" value="{{ sale.quantity }}" required></label>
    <label>金額<input name="amount" type="number" min="0" value="{{ sale.amount|round(0)|int }}" required></label>
    <label>狀態
      <select name="status">
        {% for s in ['已認列','待確認','取消'] %}<option {% if s == sale.status %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </label>
    <label class="wide">備註<input name="note" value="{{ sale.note or '' }}"></label>
    <button type="submit">儲存修改</button>
  </form>
</section>
{% endblock %}
